title: dev, Odra!
domain: odravison.github.io
url: "https://odravison.github.io"
lang: en_US
email: oamaraljr@gmail.com
tagline: Odravison Amaral, Backend Software Engineer
description: >-
  Blog and CV of Odravison Amaral (Odra), a backend software engineer writing
  about Java, Kotlin, Python, distributed systems and life in tech careers.
author:
  name: "Odravison Amaral"
  email: "oamaraljr@gmail.com"
  url: "https://odravison.github.io/"
image: /assets/profile.jpg
logo: /assets/profile.jpg
social:
  name: "Odravison Amaral"
  links:
    - https://github.com/odravison
    - https://www.linkedin.com/in/odravison
baseurl: "" # the subpath of your site, e.g. /blog

defaults:
  -
    scope:
      path: ""
    values:
      image: /assets/profile.jpg
      twitter:
        card: summary
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

source: .
destination: ./_site
permalink: /:title
paginate: 3
paginate_path: /page/:num/

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .ruby-version

# Build settings
future: true
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

# Custom variables
owner : "Odravison"
year : "2025"